name: Tick
options:
  bundleIdPrefix: local.quote
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  PulseCore:
    path: Packages/PulseCore
  PulseUI:
    path: Packages/PulseUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.14.1"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

# Everything the two distributions share: sources, resources, the Longbridge plugin,
# and build settings. The targets below differ only in what the App Store forbids.
targetTemplates:
  TickMacApp:
    type: application
    platform: macOS
    sources:
      - PulseMac/Sources
      - PulseMac/Resources
    postBuildScripts:
      - name: Embed Longbridge SDK Plugin
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-longbridge-plugin.sh"
    settings:
      base:
        MARKETING_VERSION: "0.16.0"
        CURRENT_PROJECT_VERSION: "1793151611"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_LANGUAGE: en
        # The Longbridge plugin script writes to the SDK cache under $SRCROOT
        # and re-signs built products, which the user-script sandbox blocks.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        TELEMETRYDECK_APP_ID: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
          ENABLE_USER_SCRIPT_SANDBOXING: false
          # Ad-hoc signatures change on every build, which makes the Keychain treat each
          # rebuild as a new app and re-prompt for the Longbridge credentials. A real
          # development certificate keeps the designated requirement stable across builds.
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""

targets:
  # Direct download (DMG/zip), updated through Sparkle once a feed is configured.
  PulseMac:
    templates:
      - TickMacApp
    scheme: {}
    dependencies:
      - package: PulseCore
      - package: PulseUI
      - package: Sparkle
        product: Sparkle
      - package: TelemetryDeck
        product: TelemetryDeck
      - package: MCP
        product: MCP
    info:
      path: PulseMac/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Tick. Based on Pulse © 2026 fatwang2, MIT License."
        SUEnableAutomaticChecks: false
        SUEnableInstallerLauncherService: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUScheduledCheckInterval: 86400
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        # Longbridge OAuth fallback callback (bundle id doubles as the URL scheme,
        # keeping dev and release callbacks isolated)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: PulseMac/Pulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Loopback listener for the Longbridge OAuth redirect (primary callback path)
        # and the local MCP agent endpoint
        com.apple.security.network.server: true
        # Sparkle's installer services
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
      configs:
        Debug:
          PRODUCT_NAME: Tick Dev
          BUNDLE_DISPLAY_NAME: Tick Dev
          PRODUCT_BUNDLE_IDENTIFIER: local.quote.mac.dev
        Release:
          PRODUCT_NAME: Tick
          BUNDLE_DISPLAY_NAME: Tick
          PRODUCT_BUNDLE_IDENTIFIER: local.quote.mac

  # Mac App Store. No Sparkle (the store delivers updates, guideline 2.4.5(vii)) and
  # therefore none of its temporary-exception entitlements. Before archiving for
  # submission, set PRODUCT_BUNDLE_IDENTIFIER to the App ID registered in App Store
  # Connect and DEVELOPMENT_TEAM to your team, and switch CODE_SIGN_STYLE to
  # Automatic (or pass all three to `xcodebuild archive`).
  TickAppStore:
    templates:
      - TickMacApp
    scheme: {}
    dependencies:
      - package: PulseCore
      - package: PulseUI
      - package: TelemetryDeck
        product: TelemetryDeck
      - package: MCP
        product: MCP
    info:
      path: PulseMac/AppStore/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Tick. Based on Pulse © 2026 fatwang2, MIT License."
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: PulseMac/AppStore/Tick.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Loopback only: the Longbridge OAuth redirect and the opt-in local MCP endpoint
        com.apple.security.network.server: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        DEVELOPMENT_TEAM: DD495M342Y
      configs:
        Debug:
          # Named apart from the direct build's "Tick Dev" so the two Debug
          # products can sit in one DerivedData folder.
          PRODUCT_NAME: Tick Store Dev
          BUNDLE_DISPLAY_NAME: Tick Dev
          PRODUCT_BUNDLE_IDENTIFIER: local.quote.mac.dev
          # Debug stays ad-hoc for local runs; the team is only needed for the
          # signed Release archive.
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        Release:
          PRODUCT_NAME: Tick
          BUNDLE_DISPLAY_NAME: Tick
          PRODUCT_BUNDLE_IDENTIFIER: com.DD495M342Y.tick
          # App Store Connect rejects binaries that still carry get-task-allow.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # Manual distribution signing: the Apple Distribution certificate in
          # the keychain plus the Mac App Store profile for this bundle ID.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Tick App Store"

  # iOS app restored from upstream Pulse (96ecefa..6c2e6dc), rebadged for Tick.
  # Shares PulseCore/PulseUI and the Mac localization tables; iOS forbids
  # loadable plugins, so the Longbridge SDK links as a static library.
  TickiOS:
    type: application
    platform: iOS
    sources:
      - PulseiOS/Sources
      - PulseiOS/Resources
      # Localization tables are shared with the Mac app so both clients speak
      # with one voice; PulseLocalization resolves them from Bundle.main.
      - path: PulseMac/Resources/en.lproj
        buildPhase: resources
      - path: PulseMac/Resources/ja.lproj
        buildPhase: resources
      - path: PulseMac/Resources/zh-Hans.lproj
        buildPhase: resources
      - path: PulseMac/Resources/ko.lproj
        buildPhase: resources
      # The Icon Composer document renders the Liquid Glass app icon on iOS 26.
      - path: PulseMac/Resources/AppIcon.icon
        buildPhase: resources
      # Required-reason API disclosure. Shared with the Mac target: both clients
      # read UserDefaults for settings and the watchlist.
      - path: PulseMac/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PulseCore
      - package: PulseUI
    info:
      path: PulseiOS/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Tick. Based on Pulse © 2026 fatwang2, MIT License."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Longbridge OAuth callback (bundle id doubles as the URL scheme,
        # keeping dev and release callbacks isolated — same shape as the Mac app)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
    preBuildScripts:
      - name: Build Longbridge SDK (iOS static library)
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-longbridge-ios.sh"
    settings:
      base:
        MARKETING_VERSION: "0.16.0"
        CURRENT_PROJECT_VERSION: "1793151611"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Longbridge iOS script writes SDK artifacts under $SRCROOT/.build.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEVELOPMENT_TEAM: DD495M342Y
        OTHER_LDFLAGS: "-llongbridge_c"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/.build/longbridge-sdk/4.4.1/ios/aarch64-apple-ios"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/.build/longbridge-sdk/4.4.1/ios/aarch64-apple-ios-sim"
      configs:
        Debug:
          PRODUCT_NAME: Tick iOS Dev
          BUNDLE_DISPLAY_NAME: Tick Dev
          PRODUCT_BUNDLE_IDENTIFIER: local.quote.ios.dev
          # Simulator and local device runs stay automatic; the team is only
          # needed for the signed Release archive.
          CODE_SIGN_STYLE: Automatic
        Release:
          PRODUCT_NAME: Tick
          BUNDLE_DISPLAY_NAME: Tick
          # Same bundle ID as the Mac App Store build: one app record, one
          # purchase, both platforms.
          PRODUCT_BUNDLE_IDENTIFIER: com.DD495M342Y.tick
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Tick App Store iOS"
